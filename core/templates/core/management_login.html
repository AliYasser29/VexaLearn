{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة | VexaLearn</title>
    <link rel="stylesheet" href="{% static 'css/global_ux.css' %}">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, var(--secondary), transparent),
                radial-gradient(circle at bottom left, var(--primary-dark), transparent),
                #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 90%;
            max-width: 400px;
            padding: 48px;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-premium);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: card-fade-in 0.6s ease-out;
        }

        @keyframes card-fade-in {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: var(--secondary);
            color: white;
            border-radius: var(--radius-xl);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin: 0 auto 24px auto;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin: 0;
            color: var(--secondary);
            font-weight: 800;
            font-size: 1.8rem;
        }

        p {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .form-group {
            margin-top: 32px;
            text-align: right;
        }

        .form-group label {
            display: block;
            color: var(--text-primary);
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 14px 18px 14px 50px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.1);
        }

        input:invalid:not(:placeholder-shown) {
            border-color: var(--error);
        }

        input:valid:not(:placeholder-shown) {
            border-color: var(--success);
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-weight: 800;
            cursor: pointer;
            margin-top: 32px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            background-color: #000;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .alert {
            background-color: #fee2e2;
            color: var(--error);
            padding: 14px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            font-size: 0.9rem;
            border: 1px solid #fecaca;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo-icon">
            <i class="fas fa-user-tie"></i>
        </div>
        <h2>لوحة الإدارة</h2>
        <p>تسجيل دخول المسؤولين فقط</p>

        {% if messages %}
        {% for message in messages %}
        <div class="alert">
            <i class="fas fa-exclamation-circle"></i> {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <input type="text" name="username" required autocomplete="off">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" name="password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <button type="submit">دخول آمن <i class="fas fa-arrow-left" style="margin-right: 5px;"></i></button>
        </form>
    </div>

</body>

</html>
