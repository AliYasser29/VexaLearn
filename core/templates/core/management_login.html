<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة | VexaLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        .logo-icon {
            width: 60px;
            height: 60px;
            background: #2563eb; /* أزرق رسمي */
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin: 0 auto 20px auto;
            transform: rotate(3deg);
        }
        h2 { margin: 0; color: #1e293b; font-weight: 700; }
        p { color: #64748b; margin-top: 5px; font-size: 0.9rem; }
        
        .form-group { margin-top: 25px; text-align: right; }
        .form-group label { display: block; color: #334155; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #94a3b8; }
        
        input {
            width: 100%;
            padding: 12px 15px 12px 40px; /* مسافة للأيقونة */
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
            outline: none;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: #1e293b; /* لون داكن رسمي */
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            transition: 0.3s;
            font-size: 1rem;
        }
        button:hover { background-color: #0f172a; transform: translateY(-2px); }
        
        .alert {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon">
            <i class="fas fa-user-tie"></i>
        </div>
        <h2>لوحة الإدارة</h2>
        <p>تسجيل دخول المسؤولين فقط</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">
                    <i class="fas fa-exclamation-circle"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <input type="text" name="username" required autocomplete="off">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" name="password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <button type="submit">دخول آمن <i class="fas fa-arrow-left" style="margin-right: 5px;"></i></button>
        </form>
    </div>

</body>
</html>
