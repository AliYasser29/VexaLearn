<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اجتماع فيديو: {{ room_name }}</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            /* Tinted Neutrals */
            --bg-base: #0a0a0c;
            --bg-surface: #121216;
            --bg-elevated: #1a1a1f;
            --bg-overlay: rgba(10, 10, 12, 0.85);
            --border-subtle: #24242a;
            --border-primary: #32323a;

            --text-primary: #ffffff;
            --text-secondary: #9ca3af;

            /* Typography */
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --font-heading: 'Space Grotesk', system-ui, sans-serif;

            /* Fluid Type Scale */
            --text-xs: clamp(0.75rem, 0.7vw + 0.5rem, 0.875rem);
            --text-sm: clamp(0.875rem, 0.8vw + 0.6rem, 1rem);
            --text-base: clamp(1rem, 1vw + 0.75rem, 1.125rem);
            --text-lg: clamp(1.125rem, 1.2vw + 0.875rem, 1.25rem);
            --text-xl: clamp(1.25rem, 1.5vw + 1rem, 1.5rem);
            --text-2xl: clamp(1.5rem, 2vw + 1.2rem, 2rem);
            --text-3xl: clamp(2rem, 3vw + 1.5rem, 2.5rem);
            --text-4xl: clamp(2.5rem, 4vw + 2rem, 3.5rem);

            /* Impeccable Modular Scale */
            --spacing-1: 4px;
            --spacing-2: 8px;
            --spacing-3: 16px;
            --spacing-4: 24px;
            --spacing-5: 32px;
            --spacing-6: 48px;
            --spacing-7: 64px;

            --radius-md: 8px;
            --radius-lg: 16px;
            --radius-full: 9999px;

            --video-width: 256px;
            --video-height: 192px;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-base);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text-primary);
            line-height: 1.6;
            letter-spacing: -0.01em;
            font-size: var(--text-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: var(--font-heading);
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin: 0;
        }

        h2 {
            font-size: var(--text-3xl);
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        h4 {
            font-size: var(--text-xl);
            font-weight: 600;
        }

        h5 {
            font-size: var(--text-lg);
            font-weight: 600;
        }

        h6 {
            font-size: var(--text-base);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* Header */
        .video-header {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            padding: var(--spacing-3) var(--spacing-4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            z-index: 100;
            height: var(--spacing-7);
            border-bottom: 1px solid var(--border-subtle);
        }

        .status-badge {
            font-size: var(--text-xs);
            font-weight: 500;
            letter-spacing: 0.05em;
            padding: var(--spacing-1) var(--spacing-3);
            border-radius: var(--radius-full);
        }

        /* Video Area */
        .video-container {
            flex: 1;
            position: relative;
            background-color: var(--bg-base);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #remote-stream-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .remote-video-wrapper {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Local Video (PIP) */
        #local-stream-container {
            position: absolute;
            bottom: var(--spacing-4);
            right: var(--spacing-4);
            width: var(--video-width);
            height: var(--video-height);
            background: var(--bg-surface);
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* تأثير التوهج عند التحدث */
        .mic-active {
            border-color: #10b981 !important;
            /* أخضر */
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.4) !important;
        }

        /* Controls Bar */
        .controls-bar {
            position: absolute;
            bottom: var(--spacing-5);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: var(--spacing-3);
            z-index: 20;
            background: var(--bg-overlay);
            padding: var(--spacing-3) var(--spacing-5);
            border-radius: var(--radius-full);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            display: none;
            /* مخفي حتى الانضمام */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .btn-control {
            width: var(--spacing-6);
            height: var(--spacing-6);
            border-radius: var(--radius-full);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-xl);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-normal {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-primary);
        }

        .btn-normal:hover {
            background-color: var(--border-primary);
            transform: translateY(-4px);
        }

        .btn-active-off {
            background-color: #ef4444;
            border: 1px solid #dc2626;
        }

        .btn-screen-share {
            background-color: #0d9488;
            border: 1px solid #0f766e;
        }

        .btn-leave {
            background-color: #ef4444;
            border: 1px solid #dc2626;
            width: var(--spacing-7);
            height: var(--spacing-7);
            font-size: var(--text-2xl);
        }

        .btn-leave:hover {
            background-color: #dc2626;
            transform: translateY(-4px);
        }

        /* Start Screen Overlay */
        #start-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-overlay);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            text-align: center;
        }

        .btn-join-room {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: var(--text-primary);
            padding: var(--spacing-3) var(--spacing-6);
            border-radius: var(--radius-full);
            border: none;
            font-size: var(--text-lg);
            font-weight: 600;
            letter-spacing: -0.01em;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: var(--spacing-4);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        .btn-join-room:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4);
        }

        /* Settings Modal */
        .settings-modal {
            position: absolute;
            bottom: 84px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-surface);
            color: var(--text-primary);
            padding: var(--spacing-4);
            border-radius: var(--radius-lg);
            width: 320px;
            display: none;
            z-index: 50;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-subtle);
        }

        .settings-modal label {
            font-size: var(--text-sm);
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-1);
            display: block;
        }

        .settings-modal select {
            width: 100%;
            background: var(--bg-base);
            color: var(--text-primary);
            border: 1px solid var(--border-primary);
            padding: var(--spacing-2);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-3);
            outline: none;
        }

        .settings-modal select:focus {
            border-color: #6366f1;
        }
    </style>
</head>

<body>

    <div class="video-header">
        <div class="d-flex align-items-center gap-3">
            <h5 class="m-0 fw-bold"><i class="fas fa-video me-2 text-primary"></i> {{ room_name }}</h5>
            <span id="connection-status" class="status-badge bg-secondary text-white">غير متصل</span>
        </div>
        <a href="{% url 'chat_home' %}" class="btn btn-outline-light btn-sm rounded-pill">
            <i class="fas fa-arrow-right ms-2"></i> خروج
        </a>
    </div>

    <div class="video-container">

        <div id="start-overlay">
            <div style="font-size: 4rem; color: #6366f1; margin-bottom: 20px;">
                <i class="fas fa-headset"></i>
            </div>
            <h2>جاهز للانضمام؟</h2>
            <p style="color: #9ca3af;">يرجى السماح باستخدام المايكروفون والكاميرا</p>
            <button onclick="startMeeting()" class="btn-join-room">
                <i class="fas fa-play me-2"></i> انضمام للاجتماع
            </button>
        </div>

        <div id="remote-stream-container">
            <div id="waiting-msg" class="text-center text-secondary" style="display:none;">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <h4>في انتظار انضمام الطرف الآخر...</h4>
            </div>
        </div>

        <div id="local-stream-container"></div>

        <div id="settings-modal" class="settings-modal">
            <h6 class="mb-3 border-bottom pb-2 border-secondary">إعدادات الأجهزة</h6>
            <label><i class="fas fa-video me-2"></i> الكاميرا</label>
            <select id="camera-select"></select>
            <label><i class="fas fa-microphone me-2"></i> الميكروفون</label>
            <select id="mic-select"></select>
            <button onclick="toggleSettings()" class="btn btn-primary btn-sm w-100 mt-2">إغلاق</button>
        </div>

        <div class="controls-bar" id="controls-bar">
            <button id="mic-btn" class="btn-control btn-normal" title="كتم/تشغيل الصوت">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="camera-btn" class="btn-control btn-normal" title="إيقاف/تشغيل الكاميرا">
                <i class="fas fa-video"></i>
            </button>
            <button id="screen-share-btn" class="btn-control btn-normal" title="مشاركة الشاشة">
                <i class="fas fa-desktop"></i>
            </button>
            <button onclick="toggleSettings()" class="btn-control btn-normal" title="الإعدادات">
                <i class="fas fa-cog"></i>
            </button>
            <button id="leave-btn" class="btn-control btn-leave" title="إنهاء المكالمة">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>
    <script>
        // --- استقبال البيانات من Django ---
        const APP_ID = "{{ app_id }}";
        const TOKEN = "{{ token }}";
        const CHANNEL = "{{ room_name }}";
        const UID = {{ uid }}; // رقم المستخدم (بدون علامات تنصيص)

        const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

        let localTracks = {
            audioTrack: null,
            videoTrack: null,
            screenTrack: null
        };
        let isScreenSharing = false;

        // --- Start Meeting Function ---
        async function startMeeting() {
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('controls-bar').style.display = 'flex';
            document.getElementById('waiting-msg').style.display = 'block';

            await joinCall();
            await getDevices();
        }

        async function joinCall() {
            try {
                // الانضمام باستخدام التوكن الديناميكي
                await client.join(APP_ID, CHANNEL, TOKEN, UID);
                updateStatus("connected");

                // إنشاء المسارات
                [localTracks.audioTrack, localTracks.videoTrack] = await AgoraRTC.createMicrophoneAndCameraTracks();

                // تشغيل الفيديو المحلي
                localTracks.videoTrack.play("local-stream-container");

                // نشر المسارات
                await client.publish([localTracks.audioTrack, localTracks.videoTrack]);

                // Visualizer (تأثير الصوت)
                setInterval(() => {
                    if (localTracks.audioTrack) {
                        const level = localTracks.audioTrack.getVolumeLevel();
                        const container = document.getElementById('local-stream-container');
                        if (level > 0.01) {
                            container.style.borderColor = "#10b981";
                            container.style.boxShadow = "0 0 16px rgba(16, 185, 129, 0.4)";
                        } else {
                            container.style.borderColor = "var(--border-subtle)";
                            container.style.boxShadow = "none";
                        }
                    }
                }, 100);

            } catch (error) {
                console.error("Join Error:", error);
                updateStatus("failed");

                // معالجة خطأ انتهاء التوكن (للمستقبل)
                if (error.code === "INVALID_TOKEN") {
                    alert("انتهت صلاحية الجلسة، يرجى إعادة تحميل الصفحة.");
                    location.reload();
                } else {
                    alert("حدث خطأ في الاتصال: " + error.message);
                }
            }
        }

        // ... (باقي دوال التحكم، مشاركة الشاشة، والأجهزة تبقى كما هي في الكود السابق) ...
        // ... (انسخ دوال getDevices, populateSelect, client.on, etc. من الرد السابق) ...

        // --- Device Management ---
        async function getDevices() {
            const devices = await AgoraRTC.getDevices();
            const cameras = devices.filter(d => d.kind === "videoinput");
            const mics = devices.filter(d => d.kind === "audioinput");

            populateSelect("camera-select", cameras);
            populateSelect("mic-select", mics);

            document.getElementById("camera-select").addEventListener("change", async (e) => {
                if (localTracks.videoTrack) await localTracks.videoTrack.setDevice(e.target.value);
            });

            document.getElementById("mic-select").addEventListener("change", async (e) => {
                if (localTracks.audioTrack) await localTracks.audioTrack.setDevice(e.target.value);
            });
        }

        function populateSelect(elementId, devices) {
            const select = document.getElementById(elementId);
            select.innerHTML = "";
            devices.forEach((device, index) => {
                const option = document.createElement("option");
                option.value = device.deviceId;
                option.text = device.label || `جهاز ${index + 1}`;
                select.appendChild(option);
            });
        }

        // --- Remote Users Logic ---
        client.on("user-published", async (user, mediaType) => {
            await client.subscribe(user, mediaType);
            document.getElementById("waiting-msg").style.display = "none";

            if (mediaType === "video") {
                const remoteContainer = document.getElementById("remote-stream-container");
                const remotePlayerId = `user-${user.uid}`;
                if (!document.getElementById(remotePlayerId)) {
                    const div = document.createElement("div");
                    div.id = remotePlayerId;
                    div.className = "remote-video-wrapper";
                    remoteContainer.appendChild(div);
                }
                user.videoTrack.play(remotePlayerId);
            }

            if (mediaType === "audio") {
                user.audioTrack.play();
            }
        });

        client.on("user-unpublished", (user) => {
            const div = document.getElementById(`user-${user.uid}`);
            if (div) div.remove();
            const container = document.getElementById("remote-stream-container");
            const remoteVideos = container.querySelectorAll('.remote-video-wrapper');
            if (remoteVideos.length === 0) {
                document.getElementById("waiting-msg").style.display = "block";
            }
        });

        // --- Controls Logic ---
        const micBtn = document.getElementById("mic-btn");
        micBtn.onclick = async () => {
            if (localTracks.audioTrack) {
                const currentMuted = localTracks.audioTrack.muted;
                await localTracks.audioTrack.setMuted(!currentMuted);
                updateBtnStyle(micBtn, currentMuted, "fa-microphone", "fa-microphone-slash");
            }
        };

        const camBtn = document.getElementById("camera-btn");
        camBtn.onclick = async () => {
            if (localTracks.videoTrack && !isScreenSharing) {
                const currentMuted = localTracks.videoTrack.muted;
                await localTracks.videoTrack.setMuted(!currentMuted);
                updateBtnStyle(camBtn, currentMuted, "fa-video", "fa-video-slash");
            }
        };

        const screenBtn = document.getElementById("screen-share-btn");
        screenBtn.onclick = async () => {
            if (!isScreenSharing) {
                try {
                    localTracks.screenTrack = await AgoraRTC.createScreenVideoTrack();
                    await client.unpublish(localTracks.videoTrack);
                    await client.publish(localTracks.screenTrack);
                    localTracks.screenTrack.play("local-stream-container");
                    isScreenSharing = true;
                    screenBtn.classList.replace("btn-normal", "btn-screen-share");
                    localTracks.screenTrack.on("track-ended", stopScreenSharing);
                } catch (e) { console.error(e); }
            } else {
                stopScreenSharing();
            }
        };

        async function stopScreenSharing() {
            if (!isScreenSharing) return;
            if (localTracks.screenTrack) {
                localTracks.screenTrack.close();
                await client.unpublish(localTracks.screenTrack);
            }
            await client.publish(localTracks.videoTrack);
            localTracks.videoTrack.play("local-stream-container");
            isScreenSharing = false;
            screenBtn.classList.replace("btn-screen-share", "btn-normal");
        }

        document.getElementById("leave-btn").onclick = async () => {
            for (let track in localTracks) {
                if (localTracks[track]) { localTracks[track].stop(); localTracks[track].close(); }
            }
            await client.leave();
            window.location.href = "{% url 'chat_home' %}";
        };

        // --- Helpers ---
        function updateStatus(state) {
            const badge = document.getElementById("connection-status");
            if (state === "connected") {
                badge.innerText = "متصل ✅";
                badge.className = "status-badge bg-success text-white";
            } else {
                badge.innerText = "فشل الاتصال";
                badge.className = "status-badge bg-danger text-white";
            }
        }

        function updateBtnStyle(btn, isActive, iconOn, iconOff) {
            if (!isActive) {
                btn.classList.replace("btn-normal", "btn-active-off");
                btn.innerHTML = `<i class="fas ${iconOff}"></i>`;
            } else {
                btn.classList.replace("btn-active-off", "btn-normal");
                btn.innerHTML = `<i class="fas ${iconOn}"></i>`;
            }
        }

        window.toggleSettings = () => {
            const modal = document.getElementById("settings-modal");
            modal.style.display = modal.style.display === "block" ? "none" : "block";
        };
    </script>
</body>

</html>
