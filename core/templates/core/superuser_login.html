{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>دخول الإدارة العليا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/global_ux.css' %}">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, var(--error), transparent),
                radial-gradient(circle at bottom left, var(--secondary), transparent),
                #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 48px;
            border-radius: var(--radius-2xl);
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: var(--shadow-premium);
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: tremor 0.4s ease-in-out;
        }

        @keyframes tremor {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        h2 {
            margin-top: 0;
            color: var(--secondary);
            font-weight: 800;
            font-size: 1.8rem;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--error);
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        input:invalid:not(:placeholder-shown) {
            border-color: var(--error);
        }

        input:valid:not(:placeholder-shown) {
            border-color: var(--success);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--error);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            cursor: pointer;
            font-weight: 800;
            font-size: 1.1rem;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background: #b91c1c;
            transform: scale(1.02);
            box-shadow: 0 12px 24px rgba(239, 68, 68, 0.3);
        }

        .error {
            color: var(--error);
            background: #fee2e2;
            padding: 12px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            font-size: 0.9rem;
            border: 1px solid #fecaca;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2 style="margin-top: 0;">🔒 دخول المراقب العام</h2>
        <p style="color: #64748b; margin-bottom: 20px;">هذه المنطقة مخصصة للمدير العام فقط</p>

        {% if messages %}
        {% for message in messages %}
        <div class="error">{{ message }}</div>
        {% endfor %}
        {% endif %}

        {% if form.errors %}
        <div class="error">اسم المستخدم أو كلمة المرور غير صحيحة</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="اسم المستخدم (Admin)" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
        </form>
    </div>
</body>

</html>
