{% extends "base_rtl.html" %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <!-- User Hero Section -->
    <div class="glass-morphism rounded-2xl p-8 flex items-center gap-6 shadow-sm">
        <img src="/static/avatar.png" class="w-24 h-24 rounded-full bg-slate-200 border-4 border-white shadow-md">
        <div>
            <h2 class="text-2xl font-bold">{{ student.name }}</h2>
            <p class="text-primary font-medium">طالب - السنة الدراسية {{ student.academic_year.name }}</p>
            <div class="flex gap-4 mt-4">
                <div class="text-center"><p class="text-xl font-bold text-primary">12</p><p class="text-xs text-slate-500">كورس مكتمل</p></div>
                <div class="text-center"><p class="text-xl font-bold text-primary">48</p><p class="text-xs text-slate-500">ساعة تدريبية</p></div>
            </div>
        </div>
    </div>

    <!-- Tabbed Interface -->
    <div class="glass-morphism rounded-2xl p-6">
        <div class="flex border-b border-slate-200 gap-6 mb-6">
            <button class="pb-3 border-b-2 border-primary text-primary font-semibold">المعلومات الشخصية</button>
            <button class="pb-3 text-slate-500">كورساتي</button>
            <button class="pb-3 text-slate-500">الإنجازات</button>
        </div>
        <div class="grid grid-cols-2 gap-6">
            <div><label class="block text-sm text-slate-500">رقم الهاتف</label><p class="font-medium">{{ student.parent_phone }}</p></div>
            <div><label class="block text-sm text-slate-500">الدولة</label><p class="font-medium">{{ student.country.name }}</p></div>
        </div>
    </div>
</div>
{% endblock %}
