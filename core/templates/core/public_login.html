{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | VexaLearn</title>
    <link rel="stylesheet" href="{% static 'css/global_ux.css' %}">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top right, var(--primary-light), transparent),
                radial-gradient(circle at bottom left, var(--secondary), transparent),
                var(--bg-main);
            overflow: hidden;
            position: relative;
        }

        /* --- Circle Background --- */
        .circles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .circles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            animation: animate 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }

        .circles li:nth-child(1) {
            left: 25%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
        }

        .circles li:nth-child(2) {
            left: 10%;
            width: 20px;
            height: 20px;
            animation-delay: 2s;
            animation-duration: 12s;
        }

        .circles li:nth-child(3) {
            left: 70%;
            width: 20px;
            height: 20px;
            animation-delay: 4s;
        }

        @keyframes animate {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }

            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* --- Login Card --- */
        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 48px;
            border-radius: var(--radius-2xl);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 90%;
            max-width: 440px;
            box-shadow: var(--shadow-premium);
            z-index: 10;
            text-align: center;
            position: relative;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        /* --- Role Switch --- */
        .role-switch {
            display: flex;
            background: #eff6ff;
            padding: 6px;
            border-radius: var(--radius-lg);
            margin-bottom: 28px;
            border: 1px solid var(--border-color);
        }

        .role-option {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            z-index: 2;
            font-weight: 700;
            color: var(--text-secondary);
            transition: 0.3s;
            border-radius: var(--radius-md);
        }

        .role-option.active {
            color: var(--primary);
            background: white;
            box-shadow: var(--shadow-sm);
        }

        /* --- Inputs --- */
        .input-group {
            margin-bottom: 24px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            top: 50%;
            right: 18px;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 14px 50px 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .form-control:invalid:not(:placeholder-shown) {
            border-color: var(--error);
        }

        .form-control:valid:not(:placeholder-shown) {
            border-color: var(--success);
        }

        /* --- Submit Button --- */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 12px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.3);
        }

        .alert-error {
            background: #fee2e2;
            color: var(--error);
            padding: 12px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            font-size: 0.9rem;
            border: 1px solid #fecaca;
        }

        .back-link {
            margin-top: 24px;
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>

    <ul class="circles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <div class="login-card">
        <div class="logo"><i class="fas fa-graduation-cap"></i> VexaLearn</div>
        <p class="subtitle">سجل دخولك لمتابعة رحلتك التعليمية</p>

        {% if messages %}
        {% for message in messages %}
        <div class="alert-error"><i class="fas fa-exclamation-circle"></i> {{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="role-switch">
                <div class="role-option active" onclick="selectRole('student')">
                    <i class="fas fa-user-graduate"></i> طالب
                </div>
                <div class="role-option" onclick="selectRole('teacher')">
                    <i class="fas fa-chalkboard-teacher"></i> معلم
                </div>
                <input type="hidden" name="login_type" id="loginType" value="student">
            </div>

            <div class="input-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required
                        autofocus>
                </div>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">تسجيل الدخول</button>
        </form>

        <a href="{% url 'landing_page' %}" class="back-link">العودة للصفحة الرئيسية</a>
    </div>

    <script>
        function selectRole(role) {
            // تحديث الشكل
            const options = document.querySelectorAll('.role-option');
            options.forEach(opt => opt.classList.remove('active'));

            if (role === 'student') {
                options[0].classList.add('active');
            } else {
                options[1].classList.add('active');
            }

            // تحديث القيمة المخفية
            document.getElementById('loginType').value = role;

            // تأثير بصري بسيط (اختياري: تغيير لون الزر مثلاً)
            const btn = document.querySelector('.btn-submit');
            if (role === 'teacher') {
                btn.style.background = '#0d9488'; // لون مختلف للمعلم
            } else {
                btn.style.background = '#4f46e5';
            }
        }
    </script>

</body>

</html>
